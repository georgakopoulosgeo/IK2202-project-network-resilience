hostname r1
!
interface eth0
 ip ospf cost 1000
!
interface eth1
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf bfd
 ip ospf bfd profile fast
!
interface eth2
 ip ospf cost 100
 ip ospf network point-to-point
 ip ospf bfd
 ip ospf bfd profile fast
!
router ospf
 ospf router-id 1.1.1.1
 passive-interface eth0
 network 10.0.0.0/24 area 0
 network 10.0.1.0/30 area 0
 network 10.0.2.0/30 area 0
!

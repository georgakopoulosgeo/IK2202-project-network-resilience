hostname r2
!
interface eth0
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf bfd
!
interface eth1
 ip ospf cost 100
 ip ospf network point-to-point
 ip ospf bfd
!
interface eth2
 ip ospf cost 1000
!
router ospf
 ospf router-id 2.2.2.2
 passive-interface eth2
 network 10.0.1.0/30 area 0
 network 10.0.2.0/30 area 0
 network 10.0.3.0/24 area 0
!
